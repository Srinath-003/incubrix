[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "incubrix"
version = "0.1.0"
description = "IncuBrix Distribution: Long-Tail Destination Network"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "IncuBrix Team" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "motor>=3.5.0",
    "pymongo>=4.8.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
